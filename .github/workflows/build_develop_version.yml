name: build_develop_version

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write # 赋予修改 Release 的权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and setup NVGT compiler
      run: |
        set -e
        mkdir -p nvgt
        curl -L https://github.com/samtupy/nvgt/releases/download/latest/nvgt_0.90.0_dev.tar.gz -o nvgt.tar.gz
        echo "===== TAR CONTENTS ====="
        tar -xzf nvgt.tar.gz -C nvgt
        echo "===== EXTRACTED FILES ====="
        ls -a
        rm nvgt.tar.gz
        chmod +x $GITHUB_WORKSPACE/nvgt/nvgt

#    - name: build windows client
#      run: |
#        $GITHUB_WORKSPACE/nvgt/nvgt tk.nvgt --compile-debug -p windows

    - name: build windows server
      run: |
        cd $GITHUB_WORKSPACE/server
        $GITHUB_WORKSPACE/nvgt/nvgt tkserver.nvgt --compile-debug -p windows

    - name: build linux server
      run: |
        cd $GITHUB_WORKSPACE/server
        $GITHUB_WORKSPACE/nvgt/nvgt server/tkserver.nvgt --compile-debug -p linux

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest-develop-version"
        name: "latest develop version"
        body: |
          ${{ github.sha }}
          ${{ github.event.head_commit.message }}
        prerelease: true
        files: |
          tkserver.zip
          tkserver.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
